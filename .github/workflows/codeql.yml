name: codeql

# Static analysis on PRs and weekly against the default branch.
# Language detection is automatic; add explicit `language:` entries below
# if you need to opt out of any.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "37 6 * * 1"   # Mondays 06:37 UTC (rolled 7 minutes off the hour to avoid CI dogpile)
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "python"]
        # Add or remove based on the repo:
        #   "cpp" "csharp" "go" "java-kotlin" "ruby" "rust" "swift" "actions"

    steps:
      - uses: actions/checkout@v4

      - name: Init CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
